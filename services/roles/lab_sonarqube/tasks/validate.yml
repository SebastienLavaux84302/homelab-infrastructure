---
- name: Vérifier les paramètres système et les listes de paquets
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family | default('') == 'RedHat'
      - ansible_facts.distribution_major_version | default('') == '9'
      - lab_sonarqube_version is match('^[0-9]+([.][0-9]+){2,3}$')
      - lab_sonarqube_archive_path is match('^/')
      - lab_sonarqube_archive_sha256 is match('^[A-Fa-f0-9]{64}$')
      - lab_sonarqube_install_dir is match('^/[A-Za-z0-9._/-]+$')
      - lab_sonarqube_cache_dir is match('^/[A-Za-z0-9._/-]+$')
      - lab_sonarqube_install_dir == (lab_sonarqube_install_dir | normpath)
      - lab_sonarqube_cache_dir == (lab_sonarqube_cache_dir | normpath)
      - lab_sonarqube_install_dir not in ['/', '/opt', '/var', '/usr', '/etc']
      - lab_sonarqube_cache_dir not in ['/', '/opt', '/var', '/usr', '/etc', lab_sonarqube_install_dir]
      - lab_sonarqube_java_path is match('^/[A-Za-z0-9._/-]+$')
      - lab_sonarqube_user is match('^[a-z_][a-z0-9_-]*$')
      - lab_sonarqube_group is match('^[a-z_][a-z0-9_-]*$')
      - lab_sonarqube_listen_address is match('^[A-Za-z0-9:._-]+$')
      - lab_sonarqube_min_map_count | int > 0
      - lab_sonarqube_packages is sequence
      - lab_sonarqube_packages is not string
      - lab_sonarqube_packages | length > 0
      - lab_sonarqube_enablerepo is sequence
      - lab_sonarqube_enablerepo is not string
      - lab_sonarqube_disablerepo is sequence
      - lab_sonarqube_disablerepo is not string
      - lab_sonarqube_listen_port | int >= 1
      - lab_sonarqube_listen_port | int <= 65535
    fail_msg: "Vérifier les paramètres RHEL 9, la version, les chemins, le SHA-256, les paquets et les dépôts."
    quiet: true

- name: Vérifier les paramètres de la base PostgreSQL
  ansible.builtin.assert:
    that:
      - lab_sonarqube_jdbc_url is match('^jdbc:postgresql://.+')
      - lab_sonarqube_jdbc_username | length > 0
      - lab_sonarqube_jdbc_password | length > 0
    fail_msg: "Renseigner l'URL JDBC, le compte et le mot de passe PostgreSQL."
    quiet: true
  no_log: true

- name: Vérifier l'archive locale sur le contrôleur
  ansible.builtin.stat:
    path: "{{ lab_sonarqube_archive_path }}"
    checksum_algorithm: sha256
  register: lab_sonarqube_controller_archive_stat
  delegate_to: localhost
  become: false

- name: Comparer le SHA-256 à la valeur fournie
  ansible.builtin.assert:
    that:
      - lab_sonarqube_controller_archive_stat.stat.isreg | default(false)
      - lab_sonarqube_controller_archive_stat.stat.checksum | default('') | lower == lab_sonarqube_archive_sha256 | lower
    fail_msg: "Archive absente du contrôleur ou SHA-256 différent de la valeur attendue."
    quiet: true

- name: Lire la limite actuelle de zones mémoire
  ansible.builtin.slurp:
    src: /proc/sys/vm/max_map_count
  register: lab_sonarqube_map_count_raw

- name: Vérifier la limite mémoire nécessaire à SonarQube
  ansible.builtin.assert:
    that:
      - (lab_sonarqube_map_count_raw.content | b64decode | trim | int) >= (lab_sonarqube_min_map_count | int)
    fail_msg: "vm.max_map_count est trop bas : consulter la documentation du rôle avant de le modifier."
    quiet: true
